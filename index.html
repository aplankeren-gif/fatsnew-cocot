/* Container Animasi Emoji Background */
.emoji-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}

.emoji-item {
    position: absolute;
    bottom: -60px;
    font-size: 28px;
    opacity: 0.35;
    animation: floatUp 4s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.15));
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
    }
    20% {
        opacity: 0.45;
    }
    80% {
        opacity: 0.45;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
    }
}

/* Container Tampilan Pro Tengah */
.loading-box {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    background: radial-gradient(circle, rgba(20,20,28,0.6) 0%, rgba(11,11,14,0.9) 100%);
}

/* Modern Pro Spinner */
.spinner-ring {
    position: relative;
    width: 65px;
    height: 65px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 22px;
}

.spinner-ring div {
    box-sizing: border-box;
    display: block;
    position: absolute;
    width: 54px;
    height: 54px;
    border: 4px solid transparent;
    border-radius: 50%;
    animation: spinRing 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    border-color: #008069 transparent transparent transparent;
}

.spinner-ring div:nth-child(1) { animation-delay: -0.45s; }
.spinner-ring div:nth-child(2) { animation-delay: -0.3s; }
.spinner-ring div:nth-child(3) { animation-delay: -0.15s; }

.center-icon {
    font-size: 20px;
    animation: pulse 1.5s infinite ease-in-out;
}

@keyframes spinRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
}

/* Teks Loading */
.loading-text {
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;

.dots span:nth-child(3) { animation-delay: .4s; }
